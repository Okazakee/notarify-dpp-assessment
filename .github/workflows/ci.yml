name: CI

# One workflow. It validates the real repository contract with the same commands
# a developer runs locally, against a real PostgreSQL server — never SQLite.
#
# Pull requests may trigger this as a convenience, but the project does not
# require them: direct verified milestone merges into main are the adopted
# workflow.

on:
  push:
    branches:
      - main
      - 'build/**'
      - 'chore/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: notarify
          POSTGRES_PASSWORD: notarify_ci_only
          POSTGRES_DB: notarify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notarify -d notarify_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # A real Redis server for the cache integration suite. The API treats the cache as
      # disposable, so the service is evidence rather than a correctness dependency.
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://notarify:notarify_ci_only@localhost:5432/notarify_ci?schema=public
      JWT_SECRET: ci-only-secret-not-for-production
      CORS_ORIGIN: http://localhost:3001
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to a fresh database
        run: pnpm exec prisma migrate deploy --config prisma7.config.ts

      - name: Repository contract
        run: pnpm check

      # The committed OpenAPI document is a deliverable, so a controller or DTO change that
      # was not accompanied by a regenerated artifact fails here rather than reaching review.
      - name: OpenAPI drift check
        run: pnpm openapi:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Dependency audit
        run: pnpm audit

  # The reviewer's path is the container stack, so it is built and exercised independently of
  # the native suites above. This is what catches packaging regressions the host stack cannot
  # see - a baked API origin, a missing tracked file, a migration that never runs.
  compose:
    name: Packaged stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exactly the documented reviewer setup, with no extra configuration.
      - name: Prepare the environment
        run: cp .env.example .env

      - name: Build the images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the stack to become healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health/ready >/dev/null && curl -fsS http://localhost:3001/health >/dev/null; then
              echo "stack is ready"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become ready"
          docker compose ps
          exit 1

      - name: Seed the demo data and prove the schema came from the migration service
        run: |
          docker compose run --rm seed
          docker compose exec -T postgres psql -U notarify -d notarify -t -A \
            -c 'SELECT count(*) FROM "User";' | grep -qE '^[1-9]' \
            && echo 'seed reached the migrated database'

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Packaged smoke suite
        run: pnpm test:smoke

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color
